<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steller</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#05060c;color:#fff}body{background:radial-gradient(circle at 20% 20%,#171332 0,transparent 35%),radial-gradient(circle at 80% 80%,#08202e 0,transparent 35%),#05060c}button,input{font:inherit}canvas{position:fixed;inset:0;z-index:0}.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}.bar{height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#070812dd;border-bottom:1px solid #ffffff12;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;min-width:120px}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#765cff,#35c5ff);box-shadow:0 0 25px #765cff55}.tabs{display:flex;gap:6px;flex:1;overflow:auto}.tab{height:38px;min-width:150px;border:1px solid #ffffff0c;border-radius:11px;background:#ffffff08;color:#fff;padding:0 12px;cursor:pointer;text-align:left;white-space:nowrap}.tab.active{background:#ffffff12;border-color:#765cff55}.add,.gear{border:0;background:#ffffff08;color:#b8bed8;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:20px}.main{height:calc(100% - 62px);display:grid;place-items:center;overflow:auto}.hero{text-align:center;width:min(820px,92%);margin-top:-7vh;animation:in .7s ease}@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#747b99}.title{font-size:clamp(55px,9vw,90px);line-height:1;font-weight:900;letter-spacing:-.07em;background:linear-gradient(120deg,#fff,#aaa4ff,#65d8ff);color:transparent;background-clip:text;margin:14px 0}.sub{color:#7e859f;line-height:1.7;margin:0 auto 26px;max-width:570px}.search{height:62px;display:flex;align-items:center;padding:7px 8px 7px 18px;border:1px solid #8b7cff33;background:#080914dd;border-radius:18px;box-shadow:0 20px 80px #0007}.search input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:0 12px}.search button,.go{border:0;border-radius:12px;height:46px;padding:0 18px;color:white;font-weight:700;background:linear-gradient(135deg,#765cff,#35b9ff);cursor:pointer}.chips{display:flex;justify-content:center;gap:8px;margin-top:16px}.chip{border:1px solid #ffffff12;background:#ffffff08;color:#8d94ad;border-radius:99px;padding:8px 12px;cursor:pointer}.results{width:min(920px,94%);padding:35px 0 80px}.results h2{font-size:22px;margin:0 0 18px}.result{display:block;text-align:left;text-decoration:none;color:white;border:1px solid #ffffff0d;background:#ffffff06;border-radius:15px;padding:17px;margin:9px 0;cursor:pointer;transition:.18s}.result:hover{transform:translateY(-2px);border-color:#765cff55;background:#ffffff0a}.result b{display:block;font-size:16px;margin-bottom:6px}.result small{display:block;color:#59d3a4;font-size:12px;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result span{color:#858ca5;font-size:13px;line-height:1.5}.status{color:#7e859f;text-align:center;padding:30px}.panel{display:none;position:fixed;right:16px;top:76px;width:340px;padding:18px;border:1px solid #ffffff14;border-radius:18px;background:#0a0b15ee;backdrop-filter:blur(25px);z-index:8;box-shadow:0 25px 90px #0009}.panel.open{display:block}.panel h3{margin:0 0 5px}.panel p{font-size:12px;color:#777e98}.field{margin-top:17px;padding-top:15px;border-top:1px solid #ffffff0d}.field label{display:block;font-size:12px;color:#aeb4cd;margin-bottom:8px}.field input{width:100%;height:40px;border:1px solid #ffffff12;border-radius:10px;background:#090a12;color:#fff;padding:0 10px}.colors{display:flex;gap:8px}.c{width:32px;height:32px;border:2px solid transparent;border-radius:9px;cursor:pointer}.c.on{border-color:#fff}.viewer{display:none;position:fixed;inset:62px 0 0;z-index:5;background:#05060c}.viewer.on{display:flex;flex-direction:column}.address{height:54px;display:flex;gap:8px;padding:8px;border-bottom:1px solid #ffffff10;background:#080914ee}.address button{flex:0 0 auto}.address input{flex:1;background:#0c0d17;border:1px solid #ffffff12;border-radius:10px;color:#fff;padding:0 12px;outline:0}.frame{flex:1;width:100%;border:0;background:#fff}.loading{position:absolute;inset:54px 0 0;display:none;place-items:center;background:#080914ee;z-index:2}.loading.on{display:grid}.spinner{width:35px;height:35px;border:3px solid #ffffff20;border-top-color:#8c7cff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:10;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#11131f;border:1px solid #ffffff14;padding:10px 14px;border-radius:10px;color:#dfe3f5;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.brand{min-width:auto}.brand span{display:none}.tab{min-width:110px}.panel{width:calc(100% - 24px);right:12px}.chips{flex-wrap:wrap}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
<header class="bar">
<div class="brand"><div class="logo">S</div><span id="name">Steller</span></div>
<div class="tabs" id="tabs"></div><button class="add" id="add">+</button><button class="gear" id="gear">⚙</button>
</header>
<main class="main" id="main">
<section class="hero" id="home">
<div class="eyebrow">Private browsing space</div><div class="title" id="title">Steller</div>
<p class="sub">Search the web and explore public websites without leaving Steller.</p>
<form class="search" id="form"><span>⌕</span><input id="q" placeholder="Search the web or enter a URL" autocomplete="off"><button>Search</button></form>
<div class="chips"><button class="chip" data-q="news">News</button><button class="chip" data-q="youtube">YouTube</button><button class="chip" data-q="github">GitHub</button><button class="chip" data-q="games">Games</button></div>
</section>
<section class="results" id="results" hidden></section>
</main></div>
<section class="viewer" id="viewer">
<div class="address"><button class="add" id="back">‹</button><button class="add" id="forward">›</button><button class="add" id="homeBtn">⌂</button><input id="url" placeholder="Enter a URL"><button class="go" id="go">Go</button></div>
<div class="loading" id="loading"><div class="spinner"></div></div><iframe class="frame" id="frame" title="Steller website viewer"></iframe>
</section>
<aside class="panel" id="panel"><h3>Steller settings</h3><p>Changes are saved locally in this browser.</p><div class="field"><label>Website name</label><input id="nameInput" maxlength="24"></div><div class="field"><label>Accent</label><div class="colors"><button class="c on" data-c="#765cff" style="background:#765cff"></button><button class="c" data-c="#21b8ff" style="background:#21b8ff"></button><button class="c" data-c="#ff5ca8" style="background:#ff5ca8"></button><button class="c" data-c="#55d889" style="background:#55d889"></button></div></div><div class="field"><button id="clear" style="width:100%;height:40px;background:#11131d;color:#fff;border:1px solid #ffffff12;border-radius:10px;cursor:pointer">Reset settings</button></div></aside>
<div class="toast" id="toast"></div>
<script>
const $=x=>document.querySelector(x), $$=x=>document.querySelectorAll(x);
let name=localStorage.name||'Steller',accent=localStorage.accent||'#765cff';
let tabs=[{id:1,title:'New tab',url:null}],activeTab=1,history=[],historyIndex=-1;
document.documentElement.style.setProperty('--accent',accent);
function apply(){document.title=name;$('#name').textContent=name;$('#title').textContent=name;$('#nameInput').value=name}apply();
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)}
function renderTabs(){let box=$('#tabs');box.innerHTML='';tabs.forEach(t=>{let b=document.createElement('button');b.className='tab '+(t.id===activeTab?'active':'');b.textContent='● '+(t.title||'New tab');b.onclick=()=>switchTab(t.id);box.appendChild(b)})}
function switchTab(id){activeTab=id;let t=tabs.find(x=>x.id===id);renderTabs();if(t&&t.url)openPage(t.url,false);else showHome()}
function addTab(){let id=Date.now();tabs.push({id,title:'New tab',url:null});activeTab=id;renderTabs();showHome();toast('New tab created')}
$('#add').onclick=addTab;renderTabs();
function normalize(v){v=v.trim();if(!v)return null;if(/^https?:\/\//i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v))return'https://'+v;return null}
function showHome(){ $('#viewer').classList.remove('on');$('#home').hidden=false;$('#results').hidden=true;$('#q').focus() }
function showResults(){ $('#viewer').classList.remove('on');$('#home').hidden=true;$('#results').hidden=false }
async function search(v){v=v.trim();if(!v)return;let direct=normalize(v);if(direct){openPage(direct,true);return}showResults();$('#results').innerHTML='<div class="status">Searching the web…</div>';try{let r=await fetch('/api/search?q='+encodeURIComponent(v));let data=await r.json();if(!r.ok)throw new Error(data.error||'Search failed');let out='<h2>Results for “'+escapeHtml(v)+'”</h2>';if(!data.results.length)out+='<div class="status">No results were returned.</div>';data.results.forEach(item=>{out+='<a class="result" href="#" data-url="'+escapeAttr(item.url)+'"><b>'+escapeHtml(item.title)+'</b><small>'+escapeHtml(item.displayUrl)+'</small><span>'+escapeHtml(item.url)+'</span></a>'});$('#results').innerHTML=out;$$('.result').forEach(a=>a.onclick=e=>{e.preventDefault();openPage(a.dataset.url,true)})}catch(e){$('#results').innerHTML='<div class="status">'+escapeHtml(e.message||'Search failed.')+'</div>'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}
function openPage(raw,push=true){let u=normalize(raw)||raw;try{u=new URL(u,location.href).href}catch{return toast('That URL is not valid')};if(!/^https?:/i.test(u))return toast('Only HTTP and HTTPS websites are supported');let t=tabs.find(x=>x.id===activeTab);if(t){t.url=u;try{t.title=new URL(u).hostname}catch{t.title='Website'}}renderTabs();$('#url').value=u;$('#viewer').classList.add('on');$('#loading').classList.add('on');$('#frame').src='/api/proxy?url='+encodeURIComponent(u);if(push){history=history.slice(0,historyIndex+1);history.push(u);historyIndex=history.length-1}updateNav()}
function updateNav(){$('#back').disabled=historyIndex<=0;$('#forward').disabled=historyIndex>=history.length-1}
$('#form').onsubmit=e=>{e.preventDefault();search($('#q').value)};$$('.chip').forEach(b=>b.onclick=()=>search(b.dataset.q));$('#go').onclick=()=>openPage($('#url').value,true);
$('#frame').onload=()=>$('#loading').classList.remove('on');
$('#back').onclick=()=>{if(historyIndex>0){historyIndex--;openPage(history[historyIndex],false);updateNav()}};
$('#forward').onclick=()=>{if(historyIndex<history.length-1){historyIndex++;openPage(history[historyIndex],false);updateNav()}};
$('#homeBtn').onclick=showHome;
$('#gear').onclick=()=>$('#panel').classList.toggle('open');
$('#nameInput').oninput=e=>{name=e.target.value.trim()||'Steller';localStorage.name=name;apply()};
$$('.c').forEach(b=>b.onclick=()=>{accent=b.dataset.c;localStorage.accent=accent;document.documentElement.style.setProperty('--accent',accent);$$('.c').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
$('#clear').onclick=()=>{localStorage.clear();name='Steller';accent='#765cff';document.documentElement.style.setProperty('--accent',accent);apply();toast('Settings reset')};
let c=$('#stars'),x=c.getContext('2d'),ps=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ps=Array.from({length:130},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,s:Math.random()*.25+.04,a:Math.random()*.7+.2}))}size();onresize=size;function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(let p of ps){p.y-=p.s;if(p.y<0)p.y=innerHeight;x.globalAlpha=p.a;x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
